# Data-only mod (recipes and advancements), so there is no Java mod class
license = "CC0-1.0"
issueTrackerURL = "https://github.com/d4rkm0nkey/minecraft-craftable-horse-items/issues"

[[mods]]
modId = "craftablehorseitems"
version = "${version}"
displayName = "Craftable Horse Items"
displayURL = "https://modrinth.com/mod/4PjsRIPB"
iconFile = "assets/craftablehorseitems/icon.png"
authors = "lumpyMonkey"
description = '''Adds crafting recipes for copper, iron, golden and diamond horse armor and an alternative saddle recipe.'''
# Recipes are server-side: clients without the mod can still join
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.craftablehorseitems]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
