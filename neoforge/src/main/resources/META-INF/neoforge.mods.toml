# Data-only mod (recipes and advancements), so there is no Java mod class
license = "CC0-1.0"
issueTrackerURL = "https://github.com/d4rkm0nkey/CraftableHorseArmor/issues"

[[mods]]
modId = "craftablehorsearmor"
version = "${version}"
displayName = "Craftable Horse Armor"
displayURL = "https://modrinth.com/mod/craftable-horse-armor"
iconFile = "assets/craftablehorsearmor/icon.png"
authors = "lumpyMonkey"
description = '''Adds crafting recipes for copper, iron, golden and diamond horse armor and an alternative saddle recipe.'''
# Recipes are server-side: clients without the mod can still join
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.craftablehorsearmor]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
