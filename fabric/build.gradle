plugins {
	id 'craftablehorseitems.loader'
	id 'fabric-loom'
}

loom {
	mods {
		"craftablehorseitems" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	// 1.21.11 is still obfuscated; the mod has no code, so the mappings only matter for the dev runs
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	// Fabric API's resource loader adds the mod's recipes as a built-in data pack
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

publishMods {
	file = remapJar.archiveFile
	// Quilt loads Fabric mods, so the Fabric jar is published for both
	modLoaders.addAll("fabric", "quilt")
	curseforge {
		requires("fabric-api")
	}
	modrinth {
		requires("fabric-api")
	}
}
